<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>조합원 관리 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#f5f7fb; --panel:#ffffff; --line:#e6e9ef; --text:#172033; --muted:#6b7280;
      --primary:#1f6f5f; --primary-dark:#175447; --danger:#c62828; --soft:#eef7f4;
      --shadow:0 12px 30px rgba(20,34,55,.08);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",Arial,sans-serif}
    .wrap{max-width:1320px;margin:0 auto;padding:28px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}
    h1{font-size:28px;margin:0}.sub{color:var(--muted);margin-top:6px;font-size:14px}
    .badge{background:var(--soft);color:var(--primary);padding:8px 12px;border-radius:999px;font-weight:700;font-size:13px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
    .connect{padding:20px;margin-bottom:18px}
    .connect-grid{display:grid;grid-template-columns:1.6fr 1.6fr auto;gap:12px}
    input,select,button{font:inherit}
    input,select{width:100%;border:1px solid #d7dce5;border-radius:10px;padding:11px 12px;background:white;outline:none}
    input:focus,select:focus{border-color:#6aa798;box-shadow:0 0 0 3px rgba(31,111,95,.10)}
    button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
    .btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-dark)}
    .btn-light{background:#f2f4f7;color:#344054}.btn-danger{background:#fff1f1;color:var(--danger)}
    .toolbar{padding:16px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .toolbar .search{flex:1;min-width:260px}.toolbar select{width:180px}
    .toolbar .spacer{flex:1}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
    .stat{padding:18px}.stat .label{font-size:13px;color:var(--muted)}.stat .value{font-size:26px;font-weight:800;margin-top:6px}
    .table-panel{overflow:hidden}
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:920px}
    th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;white-space:nowrap}
    th{background:#fafbfc;color:#475467;font-size:12px;text-transform:none;position:sticky;top:0}
    tr:hover td{background:#fcfdfd}
    .actions{display:flex;gap:6px}
    .actions button{padding:7px 9px;font-size:12px}
    .empty{padding:48px 20px;text-align:center;color:var(--muted)}
    .locked{padding:38px;text-align:center;color:var(--muted)}
    .locked strong{display:block;color:var(--text);font-size:18px;margin-bottom:8px}
    .status{font-size:13px;margin-top:10px;color:var(--muted)}
    .status.ok{color:#18794e}.status.err{color:var(--danger)}
    dialog{border:0;border-radius:18px;padding:0;width:min(620px,calc(100vw - 32px));box-shadow:0 24px 80px rgba(0,0,0,.22)}
    dialog::backdrop{background:rgba(15,23,42,.45)}
    .modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .modal-head h2{font-size:20px;margin:0}.close{background:transparent;font-size:20px;padding:4px 8px}
    .form{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field label{display:block;font-size:12px;font-weight:700;color:#475467;margin-bottom:6px}
    .field.full{grid-column:1 / -1}
    .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
    .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f3f4f6;font-size:12px}
    .notice{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
    @media(max-width:760px){
      .wrap{padding:16px}.connect-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}
      .top{align-items:flex-start;flex-direction:column}.form{grid-template-columns:1fr}.field.full{grid-column:auto}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>조합원 관리 대시보드</h1>
      <div class="sub">Supabase `members` 테이블 기반 조회 · 등록 · 수정 · 삭제</div>
    </div>
    <div class="badge">CRUD Dashboard</div>
  </div>

  <section class="panel connect">
    <div class="connect-grid">
      <input id="loginId" placeholder="ID" autocomplete="username">
      <input id="loginPw" type="password" placeholder="PW" autocomplete="current-password">
      <button class="btn-primary" id="connectBtn">로그인</button>
    </div>
    <div id="connectStatus" class="status">ID와 PW를 입력하면 대시보드가 활성화됩니다.</div>
    <div class="notice">교육·실습용 간편 로그인입니다. 로그인 성공 후 Supabase에 자동 연결됩니다.</div>
  </section>

  <div id="app" style="display:none">
    <div class="stats">
      <section class="panel stat"><div class="label">전체 조합원</div><div class="value" id="totalCount">0</div></section>
      <section class="panel stat"><div class="label">조회 결과</div><div class="value" id="visibleCount">0</div></section>
      <section class="panel stat"><div class="label">등록 지점 수</div><div class="value" id="branchCount">0</div></section>
    </div>

    <section class="panel table-panel">
      <div class="toolbar">
        <input class="search" id="search" placeholder="조합원번호, 이름, 전화번호로 검색">
        <select id="branchFilter"><option value="">전체 지점</option></select>
        <button class="btn-light" id="refreshBtn">새로고침</button>
        <span class="spacer"></span>
        <button class="btn-primary" id="addBtn">+ 조합원 등록</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>조합원번호</th><th>이름</th><th>생년월일</th><th>성별</th><th>가입일</th><th>지점</th><th>전화번호</th><th>관리</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="empty" class="empty" style="display:none">조건에 맞는 조합원이 없습니다.</div>
      </div>
    </section>
  </div>

  <section id="locked" class="panel locked">
    <strong>로그인이 필요합니다.</strong>
    상단에 ID와 PW를 입력하면 조합원 관리 기능이 활성화됩니다.
  </section>
</div>

<dialog id="memberDialog">
  <div class="modal-head">
    <h2 id="modalTitle">조합원 등록</h2>
    <button class="close" id="closeBtn">×</button>
  </div>
  <form id="memberForm">
    <div class="form">
      <div class="field"><label>조합원번호 *</label><input id="member_id" type="number" required min="1"></div>
      <div class="field"><label>이름 *</label><input id="name" required maxlength="100"></div>
      <div class="field"><label>생년월일 *</label><input id="birth_date" type="date" required></div>
      <div class="field"><label>성별 *</label>
        <select id="gender" required><option value="">선택</option><option value="M">남</option><option value="F">여</option></select>
      </div>
      <div class="field"><label>가입일 *</label><input id="join_date" type="date" required></div>
      <div class="field"><label>지점 *</label><select id="branch_id" required></select></div>
      <div class="field full"><label>전화번호 *</label><input id="phone" required maxlength="30" placeholder="010-0000-0000"></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn-light" id="cancelBtn">취소</button>
      <button type="submit" class="btn-primary" id="saveBtn">저장</button>
    </div>
  </form>
</dialog>

<script>
const { createClient } = supabase;
let db = null, members = [], branches = [], editingId = null;

const $ = (id)=>document.getElementById(id);
const esc = (v)=>String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const branchName = id => branches.find(b=>String(b.branch_id)===String(id))?.branch_name ?? `지점 ${id}`;

const APP_LOGIN_ID = '017';
const APP_LOGIN_PW = '2026';
const SUPABASE_URL = 'https://mnobwjobpkpvruouzqes.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tyb6MdajxzNiKWtMim2-8Q_ZEMkLliS';

async function connect(){
  const id=$('loginId').value.trim(), pw=$('loginPw').value;
  if(id !== APP_LOGIN_ID || pw !== APP_LOGIN_PW){
    db=null; $('app').style.display='none'; $('locked').style.display='block';
    setStatus('ID 또는 PW가 올바르지 않습니다.', false);
    return;
  }
  try{
    db=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    setStatus('로그인 성공 · 데이터 연결 중...', true);
    const [{data:b,error:be},{data:m,error:me}] = await Promise.all([
      db.from('branches').select('branch_id,branch_name').order('branch_id'),
      db.from('members').select('*').order('member_id')
    ]);
    if(be) throw be; if(me) throw me;
    branches=b||[]; members=m||[];
    hydrateBranches(); render();
    $('locked').style.display='none'; $('app').style.display='block';
    setStatus(`로그인됨 · members ${members.length}건`, true);
    $('loginPw').value='';
  }catch(e){
    db=null; $('app').style.display='none'; $('locked').style.display='block';
    setStatus('Supabase 연결 실패: '+(e.message||e), false);
  }
}
function setStatus(msg,ok){ $('connectStatus').textContent=msg; $('connectStatus').className='status '+(ok?'ok':'err'); }
function hydrateBranches(){
  $('branchFilter').innerHTML='<option value="">전체 지점</option>'+branches.map(b=>`<option value="${esc(b.branch_id)}">${esc(b.branch_name)}</option>`).join('');
  $('branch_id').innerHTML='<option value="">선택</option>'+branches.map(b=>`<option value="${esc(b.branch_id)}">${esc(b.branch_name)}</option>`).join('');
  $('branchCount').textContent=branches.length;
}
function filtered(){
  const q=$('search').value.trim().toLowerCase(), bf=$('branchFilter').value;
  return members.filter(m=>{
    const hay=[m.member_id,m.name,m.phone].join(' ').toLowerCase();
    return (!q || hay.includes(q)) && (!bf || String(m.branch_id)===bf);
  });
}
function render(){
  const rows=filtered(); $('totalCount').textContent=members.length; $('visibleCount').textContent=rows.length;
  $('empty').style.display=rows.length?'none':'block';
  $('tbody').innerHTML=rows.map(m=>`<tr>
    <td><b>${esc(m.member_id)}</b></td>
    <td>${esc(m.name)}</td>
    <td>${esc(m.birth_date)}</td>
    <td><span class="pill">${esc(m.gender==='M'?'남':m.gender==='F'?'여':m.gender)}</span></td>
    <td>${esc(m.join_date)}</td>
    <td>${esc(branchName(m.branch_id))}</td>
    <td>${esc(m.phone)}</td>
    <td><div class="actions">
      <button class="btn-light" onclick="openEdit(${Number(m.member_id)})">수정</button>
      <button class="btn-danger" onclick="removeMember(${Number(m.member_id)}, '${esc(String(m.name)).replace(/'/g,"&#39;")}')">삭제</button>
    </div></td></tr>`).join('');
}
async function reload(){
  if(!db) return;
  const {data,error}=await db.from('members').select('*').order('member_id');
  if(error){alert('조회 실패: '+error.message);return;}
  members=data||[]; render();
}
function openAdd(){
  editingId=null; $('modalTitle').textContent='조합원 등록'; $('memberForm').reset();
  $('member_id').disabled=false; $('join_date').value=new Date().toISOString().slice(0,10);
  $('memberDialog').showModal();
}
window.openEdit=function(id){
  const m=members.find(x=>Number(x.member_id)===Number(id)); if(!m)return;
  editingId=id; $('modalTitle').textContent='조합원 수정';
  ['member_id','name','birth_date','gender','join_date','branch_id','phone'].forEach(k=>$(k).value=m[k]??'');
  $('member_id').disabled=true; $('memberDialog').showModal();
}
async function save(e){
  e.preventDefault(); if(!db)return;
  const payload={
    member_id:Number($('member_id').value), name:$('name').value.trim(), birth_date:$('birth_date').value,
    gender:$('gender').value, join_date:$('join_date').value, branch_id:Number($('branch_id').value),
    phone:$('phone').value.trim()
  };
  let error;
  if(editingId!==null){
    const update={...payload}; delete update.member_id;
    ({error}=await db.from('members').update(update).eq('member_id',editingId));
  }else{
    ({error}=await db.from('members').insert(payload));
  }
  if(error){ alert('저장 실패: '+error.message); return; }
  $('memberDialog').close(); await reload();
}
window.removeMember=async function(id,name){
  if(!db)return;
  if(!confirm(`${name} (${id}) 조합원을 삭제하시겠습니까?\\n연결된 예금/대출 등이 있으면 외래키 제약으로 삭제가 거부될 수 있습니다.`))return;
  const {error}=await db.from('members').delete().eq('member_id',id);
  if(error){ alert('삭제 실패: '+error.message); return; }
  await reload();
}

$('connectBtn').addEventListener('click',connect);
$('loginId').addEventListener('keydown',e=>{if(e.key==='Enter') connect();});
$('loginPw').addEventListener('keydown',e=>{if(e.key==='Enter') connect();});
$('refreshBtn').addEventListener('click',reload);
$('search').addEventListener('input',render);
$('branchFilter').addEventListener('change',render);
$('addBtn').addEventListener('click',openAdd);
$('memberForm').addEventListener('submit',save);
$('closeBtn').addEventListener('click',()=>$('memberDialog').close());
$('cancelBtn').addEventListener('click',()=>$('memberDialog').close());
</script>
</body>
</html>
