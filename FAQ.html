<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업무 FAQ 검색</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --highlight: #fff3a3;
      --danger-soft: #fff7ed;
      --danger-line: #fed7aa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
                   "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      width: min(960px, calc(100% - 32px));
      margin: 48px auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: -0.03em;
    }

    .header p {
      margin: 0;
      color: var(--muted);
    }

    .search-panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.05);
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      height: 48px;
      padding: 0 15px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .all-button {
      min-width: 92px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      padding: 0 16px;
    }

    .all-button:hover { filter: brightness(0.96); }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .filter-button {
      border: 1px solid var(--line);
      background: #fff;
      color: #374151;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    .filter-button.active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
    }

    .result-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 22px 2px 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .result-count strong {
      color: var(--text);
      font-size: 16px;
    }

    .results {
      display: grid;
      gap: 12px;
    }

    .faq-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
    }

    .category {
      display: inline-block;
      margin-bottom: 10px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 12px;
      font-weight: 700;
    }

    .question {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.5;
    }

    .answer {
      margin: 0;
      line-height: 1.7;
      color: #374151;
    }

    mark {
      background: var(--highlight);
      padding: 0 2px;
      border-radius: 3px;
    }

    .empty {
      background: var(--danger-soft);
      border: 1px solid var(--danger-line);
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      line-height: 1.7;
      color: #7c2d12;
      white-space: pre-line;
    }

    @media (max-width: 640px) {
      .app { margin: 24px auto; }
      .search-row { flex-direction: column; }
      .all-button { height: 46px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <h1>업무 FAQ 검색</h1>
      <p>등록된 사내 FAQ 범위 안에서만 검색 결과를 제공합니다.</p>
    </section>

    <section class="search-panel">
      <div class="search-row">
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="질문이나 키워드를 입력하세요."
          aria-label="FAQ 검색어"
        />
        <button id="showAllButton" class="all-button" type="button">전체보기</button>
      </div>

      <div class="filters" aria-label="분류 필터">
        <button class="filter-button active" data-category="전체" type="button">전체</button>
        <button class="filter-button" data-category="교육" type="button">교육</button>
        <button class="filter-button" data-category="문서" type="button">문서</button>
        <button class="filter-button" data-category="IT" type="button">IT</button>
        <button class="filter-button" data-category="보안" type="button">보안</button>
      </div>
    </section>

    <div class="result-meta">
      <div class="result-count">검색 결과 <strong id="resultCount">0</strong>건</div>
      <div id="activeFilterLabel">분류: 전체</div>
    </div>

    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <script>
    // 첨부 JSON의 내용만 사용합니다.
    const faqData = [
  {
    "category": "교육",
    "question": "교육 신청은 어디에서 하나요?",
    "answer_seed": "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다."
  },
  {
    "category": "교육",
    "question": "신청한 교육을 취소하려면 어떻게 하나요?",
    "answer_seed": "신청내역에서 취소 가능 여부를 확인합니다."
  },
  {
    "category": "문서",
    "question": "주간 업무보고에는 무엇을 넣어야 하나요?",
    "answer_seed": "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다."
  },
  {
    "category": "IT",
    "question": "사내 시스템 접속이 되지 않습니다.",
    "answer_seed": "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다."
  },
  {
    "category": "보안",
    "question": "ChatGPT에 내부 업무자료를 넣어도 되나요?",
    "answer_seed": "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다."
  }
];

    const searchInput = document.getElementById("searchInput");
    const showAllButton = document.getElementById("showAllButton");
    const resultCount = document.getElementById("resultCount");
    const results = document.getElementById("results");
    const activeFilterLabel = document.getElementById("activeFilterLabel");
    const filterButtons = [...document.querySelectorAll(".filter-button")];

    let selectedCategory = "전체";

    function normalize(text) {
      return String(text ?? "").toLowerCase().trim();
    }

    function escapeHtml(text) {
      return String(text ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function highlight(text, keyword) {
      const safeText = escapeHtml(text);
      const trimmed = keyword.trim();

      if (!trimmed) return safeText;

      const escapedKeyword = trimmed.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const regex = new RegExp(`(${escapedKeyword})`, "gi");
      return safeText.replace(regex, "<mark>$1</mark>");
    }

    function getFilteredFaqs() {
      const keyword = normalize(searchInput.value);

      return faqData.filter(item => {
        const matchesCategory =
          selectedCategory === "전체" || item.category === selectedCategory;

        const searchableText = normalize(
          `${item.question} ${item.answer_seed} ${item.category}`
        );

        const matchesKeyword =
          keyword === "" || searchableText.includes(keyword);

        return matchesCategory && matchesKeyword;
      });
    }

    function render() {
      const filtered = getFilteredFaqs();
      const keyword = searchInput.value;

      resultCount.textContent = filtered.length;
      activeFilterLabel.textContent = `분류: ${selectedCategory}`;

      if (filtered.length === 0) {
        results.innerHTML = `
          <div class="empty">
등록된 FAQ에서 답변을 찾을 수 없습니다.

관련 담당부서 또는 공식 안내자료를 확인해 주세요.
          </div>
        `;
        return;
      }

      results.innerHTML = filtered.map(item => `
        <article class="faq-card">
          <div class="category">${escapeHtml(item.category)}</div>
          <h2 class="question">${highlight(item.question, keyword)}</h2>
          <p class="answer">${highlight(item.answer_seed, keyword)}</p>
        </article>
      `).join("");
    }

    searchInput.addEventListener("input", render);

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        selectedCategory = button.dataset.category;

        filterButtons.forEach(btn =>
          btn.classList.toggle("active", btn === button)
        );

        render();
      });
    });

    showAllButton.addEventListener("click", () => {
      searchInput.value = "";
      selectedCategory = "전체";

      filterButtons.forEach(btn =>
        btn.classList.toggle("active", btn.dataset.category === "전체")
      );

      render();
      searchInput.focus();
    });

    render();
  </script>
</body>
</html>
